<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="site-nav" aria-label="Main">
        <a href="/" aria-current="page">Tests</a>
        <a href="/recorder.html">Recorder</a>
      </nav>
      <h1>Test Bench</h1>
      <p class="sub">Selenium and Playwright checks against the demo bank login.</p>
      <button id="run-all" class="run-all">Run all tests</button>
    </header>

    <main>
      <section id="test-list" aria-label="Tests">
        <p class="loading">Loading tests…</p>
      </section>

      <section id="history" class="history" hidden>
        <h2>Recent runs</h2>
        <table>
          <thead>
            <tr><th scope="col">Time</th><th scope="col">Test</th><th scope="col">Result</th><th scope="col">Duration</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

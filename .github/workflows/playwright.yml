name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Unit, API, database, dashboard, BDD, Postman & accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Throwaway PostgreSQL for the run-history / data-integrity tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testbench
          POSTGRES_PASSWORD: testbench
          POSTGRES_DB: testbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CI_JOB_ID: api
      HEADLESS: 'true'
      DATABASE_URL: postgres://testbench:testbench@localhost:5432/testbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the test suite
        run: npm run typecheck

      # One API test runs a Playwright dashboard test and the a11y tests open the dashboard, so Chromium is needed.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate BDD tests from the feature files
        run: npx bddgen

      - name: Run unit, API, database, dashboard, demo bank, BDD, accessibility & live-site tests
        run: npx playwright test --project=unit --project=api --project=a11y --project=dashboard --project=bdd-recorder --project=bank --project=bdd-bank --project=site

      - name: Run Postman collections (Newman)
        if: ${{ !cancelled() }}
        run: npm run test:postman

      - name: Upload API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload raw results for the compliance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report/
          retention-days: 1

      - name: Upload Postman (Newman) reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: reports/newman/
          retention-days: 14

  e2e:
    name: UI tests (Chromium, Firefox, WebKit)
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANK_URL: ${{ secrets.BANK_URL }}
      BANK_USERNAME: ${{ secrets.BANK_USERNAME }}
      BANK_PASSWORD: ${{ secrets.BANK_PASSWORD }}
      HEADLESS: 'true'
      CI: 'true'
      CI_JOB_ID: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests from the feature files
        run: npx bddgen

      - name: Run UI tests (specs and BDD scenarios)
        run: npx playwright test --project=chromium --project=firefox --project=webkit --project=bdd-login

      - name: Upload UI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload raw results for the compliance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-e2e
          path: blob-report/
          retention-days: 1

  compliance:
    name: Compliance evidence report
    # Runs even when tests fail: failures are exactly what the report must record.
    if: ${{ !cancelled() }}
    needs: [api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only the host is printed in the report, never the full URL or any credentials.
      BANK_URL: ${{ secrets.BANK_URL }}
      # Not used to log in: the reporter needs the values so it can blank them out of
      # step titles (Fill "...") before the report is published.
      BANK_USERNAME: ${{ secrets.BANK_USERNAME }}
      BANK_PASSWORD: ${{ secrets.BANK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw results from both test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report and one compliance report
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Post the compliance summary to this run's page
        run: cat compliance-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report/
          retention-days: 90

      - name: Upload merged test report
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          path: playwright-report/
          retention-days: 14

  container:
    name: Docker image builds, starts and passes the API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the image
        run: docker build -t bank-test-bench:ci .

      - name: Start the container
        run: docker run -d --name bench -p 3000:3000 bank-test-bench:ci

      - name: Install Newman
        run: npm ci

      - name: Run the Postman collections against the container
        run: npm run test:postman -- --base-url http://localhost:3000

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs bench

  infra:
    name: AWS infrastructure (CDK) tests and synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Infrastructure tests (security and cost rules)
        run: npm test

      - name: Synthesize CloudFormation (no AWS account needed)
        run: npx cdk synth -c allowedCidrs=203.0.113.7/32 --quiet

  # Live test results on GitHub Pages: https://abravebean.github.io/Bank-automation-test-bench/
  # Publishes the compliance report and the Postman reports (no traces: they would contain typed values).
  pages:
    name: Publish live test results (GitHub Pages)
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [api, compliance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the compliance report
        uses: actions/download-artifact@v4
        with:
          name: compliance-report
          path: _site/compliance

      - name: Download the Postman reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: postman-report
          path: _site/api

      # The playground runs Ledgerline's real rules engine (lib/demo-bank/bank.js) in the visitor's browser.
      - name: Build the playground engine
        run: npx --yes esbuild@0.23.1 lib/demo-bank/bank.js --bundle --format=iife --global-name=LedgerlineEngine --alias:crypto=./site/src/crypto-shim.js --platform=browser --target=es2020 --outfile=_site/ledgerline-engine.js

      - name: Add the landing page, requirement catalog and images
        run: cp site/index.html compliance/requirements.json docs/demo.gif docs/demo-bank.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4


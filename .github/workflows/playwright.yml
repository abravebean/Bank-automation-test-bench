name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Unit, API, database, dashboard & accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Throwaway PostgreSQL for the run-history / data-integrity tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testbench
          POSTGRES_PASSWORD: testbench
          POSTGRES_DB: testbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      HEADLESS: 'true'
      DATABASE_URL: postgres://testbench:testbench@localhost:5432/testbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One API test runs a Playwright dashboard test and the a11y tests open the dashboard, so Chromium is needed.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit, API, database, dashboard & accessibility tests
        run: npx playwright test --project=unit --project=api --project=a11y --project=dashboard

      - name: Upload API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 14

  e2e:
    name: UI tests (Chromium, Firefox, WebKit)
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANK_URL: ${{ secrets.BANK_URL }}
      BANK_USERNAME: ${{ secrets.BANK_USERNAME }}
      BANK_PASSWORD: ${{ secrets.BANK_PASSWORD }}
      HEADLESS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload UI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: playwright-report/
          retention-days: 14

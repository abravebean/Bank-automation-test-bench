name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Unit, API, database, dashboard & accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Throwaway PostgreSQL for the run-history / data-integrity tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testbench
          POSTGRES_PASSWORD: testbench
          POSTGRES_DB: testbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      CI_JOB_ID: api
      HEADLESS: 'true'
      DATABASE_URL: postgres://testbench:testbench@localhost:5432/testbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the test suite
        run: npm run typecheck

      # One API test runs a Playwright dashboard test and the a11y tests open the dashboard, so Chromium is needed.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit, API, database, dashboard & accessibility tests
        run: npx playwright test --project=unit --project=api --project=a11y --project=dashboard

      - name: Upload API test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload raw results for the compliance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: blob-report/
          retention-days: 1

  e2e:
    name: UI tests (Chromium, Firefox, WebKit)
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANK_URL: ${{ secrets.BANK_URL }}
      BANK_USERNAME: ${{ secrets.BANK_USERNAME }}
      BANK_PASSWORD: ${{ secrets.BANK_PASSWORD }}
      HEADLESS: 'true'
      CI: 'true'
      CI_JOB_ID: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload UI test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: playwright-report/
          retention-days: 14

      - name: Upload raw results for the compliance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-e2e
          path: blob-report/
          retention-days: 1

  compliance:
    name: Compliance evidence report
    # Runs even when tests fail: failures are exactly what the report must record.
    if: ${{ !cancelled() }}
    needs: [api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only the host is printed in the report, never the full URL or any credentials.
      BANK_URL: ${{ secrets.BANK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download raw results from both test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report and one compliance report
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Post the compliance summary to this run's page
        run: cat compliance-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report/
          retention-days: 90

      - name: Upload merged test report
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          path: playwright-report/
          retention-days: 14
